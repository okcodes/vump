name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create GitHub releases and upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Gate everything behind the tag matching the version recorded in source.
      # An expensive build matrix must never run for a tag that disagrees with
      # Cargo.toml.
      - name: Check release tag matches source version
        uses: ./.github/actions/check
        with:
          version: ${{ github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # unify scripting across Linux, macOS and Windows runners
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are statically linked against musl so they run on any
          # distribution regardless of its glibc version — these are downloaded
          # onto arbitrary CI runners, including old and self-hosted images.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: vump-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: vump-linux-arm64
          # Both macOS slices are merged into a single universal binary by the
          # release job; they are not published individually.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: vump-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: vump-darwin-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: vump-windows-amd64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: vump-windows-arm64.exe

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          SRC="target/${{ matrix.target }}/release/vump"
          [[ "${{ matrix.asset }}" == *.exe ]] && SRC="${SRC}.exe"
          mkdir -p dist
          cp "$SRC" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1

  release:
    name: Sign, Notarize & Release
    needs: build
    runs-on: macos-latest
    environment: Production-Signing
    env:
      KEYCHAIN_NAME: ci-signing-${{ github.run_id }}.keychain

    steps:
      - uses: actions/checkout@v6

      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      # Artifact upload does not preserve the executable bit; lipo and codesign
      # both require it.
      - name: Restore executable permissions
        run: chmod +x dist/vump-*

      - name: Import signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          chmod +x import-cert.sh
          ./import-cert.sh

      - name: Build universal binary
        run: |
          chmod +x build-universal.sh
          ./build-universal.sh

      - name: Sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD_VUMP: ${{ secrets.APP_SPECIFIC_PASSWORD_VUMP }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x notarize.sh
          ./notarize.sh

      # The per-architecture macOS slices are intentionally not published: the
      # universal binary supersedes them and is the only notarized artifact.
      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A semver pre-release carries a hyphen after the numeric core. Such
          # releases are published as GitHub pre-releases so that "latest" —
          # which the check action and self-update both resolve — continues to
          # point at the newest stable build.
          PRERELEASE=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=(--prerelease)
            echo "$TAG is a pre-release; it will not become the latest release."
          fi

          gh release create "$TAG" \
            --title "vump $TAG" \
            --generate-notes \
            "${PRERELEASE[@]}" \
            dist/vump-darwin-universal \
            dist/vump-linux-amd64 \
            dist/vump-linux-arm64 \
            dist/vump-windows-amd64.exe \
            dist/vump-windows-arm64.exe

      # Always runs — even if an earlier step fails — to ensure the ephemeral
      # keychain is not left behind on the runner.
      - name: Delete ephemeral keychain
        if: always()
        run: |
          chmod +x delete-keychain.sh
          ./delete-keychain.sh
