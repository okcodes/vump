# Two C# projects released independently from one repository.
#
# Git is off throughout the sandbox — see ../../npm/single-project/vump.toml.

[git]
through = "none"
tag_pattern = "{project}-v{new_version}"

[[project]]
name = "project-a"
files = ["ProjectA/ProjectA.csproj"]

[[project]]
name = "project-b"
files = ["ProjectB/ProjectB.csproj"]
