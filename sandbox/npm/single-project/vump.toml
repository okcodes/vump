# One npm package, versioned on its own.
#
# Git is off throughout the sandbox. These projects have no repository of their
# own — they sit inside vump's — so a commit or tag made here would land in it.
# "none" is a decision rather than silence, so an interactive run does not
# offer to commit either.

files = ["package.json", "package-lock.json"]

[git]
through = "none"
