# Two npm packages released independently from one repository.
#
# They need distinguishable tags: sharing one pattern would collide the moment
# both reach the same version, and a pushed tag would not say which package it
# describes. One repository-wide template covers both.
#
# Git is off throughout the sandbox, and the prefix keeps these out of the
# namespace vump releases from — see ../single-project/vump.toml.

[git]
through = "none"
tag_pattern = "sandbox-npm-{project}-v{new_version}"
commit_message = "chore(sandbox): bump npm/{project} to {new_version}"

[[project]]
name = "project-a"
files = ["project-a/package.json", "project-a/package-lock.json"]

[[project]]
name = "project-b"
files = ["project-b/package.json", "project-b/package-lock.json"]
