<!doctype html>
<html lang="en" style="color-scheme: dark light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — vump</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --ground: #121419;
        --ink: #f2f4f6;
        --muted: #9aa3ae;
        --signal: #5ee0bd;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --ground: #f9f9fa;
          --ink: #22262d;
          --muted: #5c636d;
          --signal: #11806a;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background: var(--ground);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8125rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      a {
        color: var(--signal);
        text-underline-offset: 0.25em;
      }
    </style>
  </head>
  <body>
    <p>404</p>
    <h1>There is nothing at this address.</h1>
    <a href="/">Back to vump</a>
  </body>
</html>
